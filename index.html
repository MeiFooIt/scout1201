    function isFirebaseConfigured() {
      return Boolean(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
    }

    function initFirebaseSync() {
      if (!isFirebaseConfigured() || !window.firebase) {
        cloudSyncStatus = 'local';
        return;
      }
      try {
        cloudSyncStatus = 'connecting';
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        db = firebase.firestore();
        const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);

        docRef.onSnapshot((snap) => {
          cloudSyncStatus = 'connected';
          if (snap.exists) {
            const remote = snap.data() || {};
            isApplyingRemoteSnapshot = true;
            if (Array.isArray(remote.members)) state.members = remote.members;
            if (Array.isArray(remote.announcements)) state.announcements = remote.announcements;
            if (Array.isArray(remote.calendarEvents)) state.calendarEvents = remote.calendarEvents;
            if (Array.isArray(remote.trashMembers)) state.trashMembers = remote.trashMembers;
            try {
              const { currentUser, pendingImportEvents, pendingBulkMembers, editingRankHistory, ...safeLocal } = state;
              localStorage.setItem(STORAGE_KEY, JSON.stringify(safeLocal));
            } catch (e) {}
            isApplyingRemoteSnapshot = false;
            renderApp();
          } else {
            // Initialize empty cloud document on very first launch
            saveToFirebaseCloud();
            renderApp();
          }
        }, (err) => {
          console.warn('Firebase snapshot error:', err);
          cloudSyncStatus = 'error';
          renderApp();
        });
      } catch (err) {
        console.warn('Firebase init failed:', err);
        cloudSyncStatus = 'error';
      }
    }

    function saveToFirebaseCloud() {
      if (!db || isApplyingRemoteSnapshot) return;
      const docRef = db.collection(FIREBASE_DOC_PATH.collection).doc(FIREBASE_DOC_PATH.doc);
      docRef.set({
        members: state.members || [],
        announcements: state.announcements || [],
        calendarEvents: state.calendarEvents || [],
        trashMembers: state.trashMembers || [],
        updatedAt: new Date().toISOString()

        console.warn('Firebase save error:', err);
        showToast('雲端同步失敗，請檢查網絡或 Firebase 權限設定', 'warning');

    // Attempt background sync with HK Government 1823 Official Open Data API for future years
    async function syncOfficialHkHolidays() {
      try {
        const res = await fetch('https://www.1823.gov.hk/common/ical/tc.json');
        if (!res.ok) return;
        const data = await res.json();
        const events = data?.vcalendar?.[0]?.vevent || [];
        let updated = false;
        events.forEach(ev => {
          const rawDate = Array.isArray(ev.dtstart) ? ev.dtstart[0] : '';
          const summary = ev.summary || '';
          if (rawDate && rawDate.length === 8 && summary) {
            const key = `${rawDate.slice(0, 4)}-${rawDate.slice(4, 6)}-${rawDate.slice(6, 8)}`;
            if (HK_PUBLIC_HOLIDAYS[key] !== summary) {
              HK_PUBLIC_HOLIDAYS[key] = summary;
              updated = true;
            }
          }
        });
        if (updated && state.activeTab === 'calendar') renderApp();
      } catch (err) {
        // Silently fall back to built-in 2026-2030 holiday data
      }
    }

    // =========================================================================
    // 3. INITIAL APP STATE (Pre-populated with Mei Foo 1201st PDF Notice Data)

    // Encoded admin password signature (plaintext is never stored directly in HTML)
    const ADMIN_PASS_SIGNATURE = [338, 359, 371, 326, 164, 167, 161, 164];

    function verifyAdminPassword(input) {
      if (!input || input.length !== ADMIN_PASS_SIGNATURE.length) return false;
      for (let i = 0; i < input.length; i++) {
        if (input.charCodeAt(i) * 3 + 17 !== ADMIN_PASS_SIGNATURE[i]) return false;
      }
      return true;
    }

    // Deterministic lightweight hash for member self-set passwords (avoids plaintext storage)
    function hashMemberPassword(raw) {
      const salted = '1201_scout_salt::' + String(raw || '');
      let h1 = 0xdeadbeef ^ salted.length;
      let h2 = 0x41c6ce57 ^ salted.length;
      for (let i = 0; i < salted.length; i++) {
        const ch = salted.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return 'h_' + (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
    }

    function saveSessionAuth() {
      try {
        if (state.currentUser && state.currentUser.role !== 'guest') {
          sessionStorage.setItem(SESSION_AUTH_KEY, JSON.stringify(state.currentUser));
        } else {
          sessionStorage.removeItem(SESSION_AUTH_KEY);
        }
      } catch (err) {}
    }

    function loadSessionAuth() {
      try {
        const raw = sessionStorage.getItem(SESSION_AUTH_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && (parsed.role === 'admin' || parsed.role === 'member')) {
            return parsed;
          }
        }
      } catch (err) {}
      return { role: 'guest', name: '訪客瀏覽', memberId: null };
    }

    function loadState() {
      const def = createDefaultState();
      const sessionUser = loadSessionAuth();
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          const merged = {
            ...def,
            ...parsed,
            currentUser: sessionUser,
            pendingImportEvents: [],
            pendingBulkMembers: [],
            editingRankHistory: [],
            expandedBadgeItems: {},
            trashMembers: Array.isArray(parsed.trashMembers) ? parsed.trashMembers : []
          };
          if (merged.activeTab === 'admin' && sessionUser.role !== 'admin') {
            merged.activeTab = 'home';
          }
          return merged;
        }
      } catch (err) {
        console.warn('LocalStorage load fallback:', err);
      }
      return { ...def, currentUser: sessionUser };
    }

    function saveState() {
      try {
        // Never persist login session in localStorage so logout + F5 always stays logged out
        const { currentUser, pendingImportEvents, pendingBulkMembers, editingRankHistory, ...toSave } = state;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      } catch (err) {
        console.warn('LocalStorage save failed:', err);
      }
      saveToFirebaseCloud();
    }

    // =========================================================================

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getBadgesForSection(section) {
      return BADGE_DATA[section] || [];
    }

    function getAllItemsForSection(section) {
      return getBadgesForSection(section).flatMap(b => b.items.map(it => ({ ...it, badgeId: b.id, badgeName: b.name })));
    }

    function getMemberStats(member) {
      const allItems = getAllItemsForSection(member.section);
      const total = allItems.length;
      let approved = 0;
      let pending = 0;
      allItems.forEach(it => {
        const rec = member.progress?.[it.id];
        if (rec?.status === 'approved') approved++;
        else if (rec?.status === 'pending') pending++;
      });
      const percent = total > 0 ? Math.round((approved / total) * 100) : 0;
      return { total, approved, pending, percent };
    }

    function getAllPendingRequests() {
      const list = [];
      state.members.forEach(m => {
        const allItems = getAllItemsForSection(m.section);
        allItems.forEach(it => {
          const rec = m.progress?.[it.id];
          if (rec?.status === 'pending') {
            list.push({ member: m, item: it, record: rec });
          }
        });
      });
      return list.sort((a, b) => (b.record.date || '').localeCompare(a.record.date || ''));
    }

    function formatDateShort(dateStr, endDateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      if (endDateStr) {
        const [, em, ed] = endDateStr.split('-').map(Number);
        if (em === m) return `${m}月${d}-${ed}日`;
        return `${m}月${d}日-${em}月${ed}日`;
      }
      return `${m}月${d}日`;
    }

    function getWeekdayZh(dateStr) {
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const d = new Date(dateStr + 'T00:00:00');
      return isNaN(d.getTime()) ? '' : `星期${days[d.getDay()]}`;
    }

        warning: 'bg-bgca-orange text-white',

      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-lg text-xs font-bold fade-in ${colors[type] || colors.info}`;
      el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-sm"></i><span>${escapeHtml(msg)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s';
        setTimeout(() => el.remove(), 260);

    function submitMemberLogin(e, nameInputId, pwdInputId) {
      e.preventDefault();
      const inputName = (document.getElementById(nameInputId)?.value || '').trim();
      const inputPwd = (document.getElementById(pwdInputId)?.value || '').trim();
      if (!inputName) return;

      const m = state.members.find(x => x.name.trim() === inputName);
      if (!m) {
        showToast('找不到此隊員姓名，請核對全名或聯絡領袖。', 'error');
        return;
      }

      // First-time login or password reset by admin -> prompt member to set personal password
      if (!m.passHash) {
        state.currentUser = { role: 'member', name: m.name, memberId: m.id };
        saveSessionAuth();
        if (state.activeTab === 'admin') state.activeTab = 'member';
        saveState();
        renderApp();
        openSetMemberPasswordModal(m.id, true);
        return;
      }

      // Returning member -> verify personal password
      if (!inputPwd || hashMemberPassword(inputPwd) !== m.passHash) {
        showToast('密碼不正確（如忘記密碼請聯絡領袖重設）', 'error');
        const pwdEl = document.getElementById(pwdInputId);
        if (pwdEl) { pwdEl.value = ''; pwdEl.focus(); }
        return;
      }

      state.currentUser = { role: 'member', name: m.name, memberId: m.id };
      saveSessionAuth();
      closeModal();

    function saveMemberPassword(e, memberId) {
      e.preventDefault();
      const p1 = (document.getElementById('mem-new-pwd')?.value || '').trim();
      const p2 = (document.getElementById('mem-new-pwd2')?.value || '').trim();
      if (p1.length < 4) {
        showToast('密碼最少需要 4 位字元', 'warning');
        return;
      }
      if (p1 !== p2) {
        showToast('兩次輸入的密碼不一致', 'error');
        return;
      }
      const m = state.members.find(x => x.id === memberId);
      if (!m) return;
      m.passHash = hashMemberPassword(p1);
      saveState();
      closeModal();
      showToast('個人密碼已設定成功！下次登入請使用新密碼。', 'success');
      renderApp();
    }

    function submitAdminPasswordLogin(e, inputId) {
      e.preventDefault();
      const inputEl = document.getElementById(inputId);
      const val = inputEl ? inputEl.value.trim() : '';
      if (verifyAdminPassword(val)) {
        state.currentUser = { role: 'admin', name: '管理員', memberId: null };
        saveSessionAuth();
        state.activeTab = 'admin';
        closeModal();
        showToast('已進入管理模式', 'success');
        renderApp();
      } else {
        showToast('密碼不正確', 'error');
        if (inputEl) {
          inputEl.value = '';
          inputEl.focus();
        }
      }
    }

    function logoutToGuest() {
      state.currentUser = { role: 'guest', name: '訪客瀏覽', memberId: null };
      saveSessionAuth();
      if (state.activeTab === 'admin') state.activeTab = 'home';
      saveState();
      closeModal();
      showToast('已登出', 'info');
      renderApp();
    }

    function loginAsMember(memberId) {
      const m = state.members.find(x => x.id === memberId);
      if (!m) return;
      state.currentUser = { role: 'member', name: m.name, memberId: m.id };
      saveSessionAuth();
      closeModal();
      showToast(`歡迎回來，${m.name}！`, 'success');
      if (state.activeTab === 'admin') state.activeTab = 'member';
      renderApp();
    }

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) cells.push(null);

      return `

            </div>
            <button onclick="shiftCalMonth(1)" class="w-9 h-9 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-600">
              <i class="fa-solid fa-chevron-right"></i>

            <div class="text-rose-500">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-bgca-blue">六</div>

    function escapeICSText(str) {
      return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/;/g, '\\;')
        .replace(/,/g, '\\,')
        .replace(/\r?\n/g, '\\n');
    }

    function buildICSContent(events) {
      const nowStamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//HK Scout 1201st//Schedule//ZH',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'X-WR-CALNAME:香港童軍九龍第1201旅集會行事曆',
        'X-WR-TIMEZONE:Asia/Hong_Kong'
      ];
      events.forEach(ev => {
        const dtStart = ev.date.replace(/-/g, '');
        const dtEndObj = new Date((ev.endDate || ev.date) + 'T00:00:00');
        dtEndObj.setDate(dtEndObj.getDate() + 1);
        const y = dtEndObj.getFullYear();
        const m = String(dtEndObj.getMonth() + 1).padStart(2, '0');
        const d = String(dtEndObj.getDate()).padStart(2, '0');
        const dtEnd = `${y}${m}${d}`;

        lines.push('BEGIN:VEVENT');
        lines.push(`UID:${ev.id}@scout1201.hk`);
        lines.push(`DTSTAMP:${nowStamp}`);
        lines.push(`DTSTART;VALUE=DATE:${dtStart}`);
        lines.push(`DTEND;VALUE=DATE:${dtEnd}`);
        lines.push(`SUMMARY:${escapeICSText('[1201旅] ' + ev.title)}`);
        lines.push(`LOCATION:${escapeICSText(ev.location || '美孚中心')}`);
        lines.push(`DESCRIPTION:${escapeICSText('時間：' + (ev.time || '待定'))}`);
        lines.push('END:VEVENT');
      });
      lines.push('END:VCALENDAR');
      return lines.join('\r\n');
    }

    function getGoogleCalendarUrl(ev) {
      const dtStart = ev.date.replace(/-/g, '');
      const dtEndObj = new Date((ev.endDate || ev.date) + 'T00:00:00');
      dtEndObj.setDate(dtEndObj.getDate() + 1);
      const dtEnd = `${dtEndObj.getFullYear()}${String(dtEndObj.getMonth() + 1).padStart(2, '0')}${String(dtEndObj.getDate()).padStart(2, '0')}`;
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: `[1201旅] ${ev.title}`,
        dates: `${dtStart}/${dtEnd}`,
        location: ev.location || '',
        details: `時間：${ev.time || ''}\n香港童軍九龍第1201旅`
      });
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    async function shareICSFile() {
      try {
        const ics = buildICSContent(state.calendarEvents);
        const file = new File([ics], 'scout_1201_schedule.ics', { type: 'text/calendar;charset=utf-8' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: '香港童軍九龍第1201旅集會行事曆'
          });
          showToast('請於分享選單中選擇「日曆」即可加入！', 'success');
          return;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
      downloadICSFile();
    }

    function downloadICSFile() {
      const ics = buildICSContent(state.calendarEvents);
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'scout_1201_schedule.ics';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('已下載日曆檔 (scout_1201_schedule.ics)！', 'success');
    }

    async function handlePdfFileUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const statusEl = document.getElementById('pdf-status-text');
      statusEl.textContent = `正在讀取 ${file.name}...`;
      try {
        if (window.pdfjsLib) {
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const buf = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
          let fullText = '';
          for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const content = await page.getTextContent();
            fullText += content.items.map(it => it.str).join(' ') + '\n';
          }
          document.getElementById('imp-raw-text').value = fullText;
          document.getElementById('imp-title').value = file.name.replace(/\.pdf$/i, '');
          statusEl.textContent = `已成功讀取 ${pdf.numPages} 頁內容，請檢視並按「智能解析排程」！`;
          parseNoticeText();
        } else {
          statusEl.textContent = 'PDF 引擎載入中，請直接貼上通告文字進行解析。';
        }
      } catch (err) {
        statusEl.textContent = '未能自動讀取此 PDF，建議直接複製通告文字貼於下方。';
      }
    }

    function parseNoticeText() {
      const raw = document.getElementById('imp-raw-text')?.value || '';
      const lines = raw.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const parsed = [];
      const dateRegex = /(\d{1,2})(?:-(\d{1,2}))?\/(\d{1,2})\/(\d{4})/;

      lines.forEach((line, idx) => {
        const m = line.match(dateRegex);
        if (!m) return;
        const d1 = String(m[1]).padStart(2, '0');
        const d2 = m[2] ? String(m[2]).padStart(2, '0') : '';
        const mon = String(m[3]).padStart(2, '0');
        const yr = m[4];
        const date = `${yr}-${mon}-${d1}`;
        const endDate = d2 ? `${yr}-${mon}-${d2}` : '';

        const timeMatch = line.match(/(早上|上午|下午|晚上)?\s*\d{1,2}:\d{2}\s*[-–至]\s*(早上|上午|下午|晚上|翌日)?\s*\d{1,2}:\d{2}/);
        const locMatch = line.match(/地點[:：]\s*([^\s]+)/);
        const time = timeMatch ? timeMatch[0] : (line.includes('不用集會') ? '全日' : '下午 2:30 - 4:30');
        const location = locMatch ? locMatch[1] : (line.includes('不用集會') ? '—' : '美孚中心');

        let title = line
          .replace(dateRegex, '')
          .replace(/(?:星期)?[一二三四五六日]、?[一二三四五六日]?/g, '')
          .replace(timeMatch ? timeMatch[0] : '', '')
          .replace(locMatch ? locMatch[0] : '', '')
          .replace(/\s+/g, ' ')
          .trim();
        if (!title) title = '旅團集會活動';

        let type = 'meeting';
        if (/不用集會|假期|休息|考試/.test(title)) type = 'holiday';
        else if (/露營|宿營|行山|遠足|郊野/.test(title)) type = 'outdoor';
        else if (/服務|義工|探訪|馬拉松|賣旗/.test(title)) type = 'service';

        parsed.push({ id: `imp_${Date.now()}_${idx}`, date, endDate, time, location, title, type });
      });

      state.pendingImportEvents = parsed;
      const area = document.getElementById('imp-preview-area');
      const listEl = document.getElementById('imp-preview-list');
      const countEl = document.getElementById('imp-preview-count');

      if (parsed.length === 0) {
        area.classList.add('hidden');
        showToast('未偵測到「日/月/年」格式日期，請檢查文字格式', 'warning');
        return;
      }

      area.classList.remove('hidden');
      countEl.textContent = `已成功辨識 ${parsed.length} 項排程（確認後即會寫入共同行事曆）：`;
      listEl.innerHTML = parsed.map(ev => {
        const meta = EVENT_TYPES[ev.type];
        return `
          <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2 text-xs">
            <div class="min-w-0">
              <span class="font-mono font-bold text-bgca-blue mr-1.5">${ev.date}${ev.endDate ? '~' + ev.endDate.slice(8) : ''}</span>
              <span class="font-bold text-slate-900">${escapeHtml(ev.title)}</span>
              <div class="text-[11px] text-slate-500">${escapeHtml(ev.time)}・${escapeHtml(ev.location)}</div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold shrink-0 ${meta.badgeBg} ${meta.badgeText}">${meta.label}</span>
          </div>
        `;
      }).join('');
    }

    function confirmImportNotice() {
      const parsed = state.pendingImportEvents || [];
      if (parsed.length === 0) return;

      const noticeTitle = document.getElementById('imp-title')?.value.trim() || '1201 旅最新通告排程';
      const replyDeadline = document.getElementById('imp-deadline')?.value.trim() || '';
      const createAnn = document.getElementById('imp-create-ann')?.checked;

      parsed.forEach(ev => state.calendarEvents.push(ev));

      if (createAnn) {
        const highlights = parsed
          .filter(e => e.type !== 'holiday')
          .slice(0, 6)
          .map(e => `${formatDateShort(e.date, e.endDate)} ${e.title}`)
          .join('；');
        const summaryText = `已匯入共 ${parsed.length} 項最新集會及活動排程並同步至「共同行事曆」。重點活動包括：${highlights || '詳見共同行事曆'}。${replyDeadline ? `請於 ${replyDeadline} 前交回出席回條給領袖團隊。` : ''}`;

        state.announcements.unshift({
          id: 'ann_' + Date.now(),
          tag: '旅團通告',
          section: 'both',
          title: noticeTitle,
          date: new Date().toISOString().slice(0, 10),
          author: '管理員',
          pinned: true,
          content: summaryText
        });
      }

      // Jump calendar to first imported event's month
      const firstDate = parsed[0].date.split('-').map(Number);
      if (firstDate.length === 3) {
        state.calYear = firstDate[0];
        state.calMonth = firstDate[1] - 1;
      }

      state.pendingImportEvents = [];
      saveState();
      closeModal();
      showToast(`已成功匯入 ${parsed.length} 項排程並更新行事曆！`, 'success');
      renderApp();
    }

                        <div class="text-xs font-black text-slate-900 mt-0.5">${escapeHtml(rh.rank)}</div>

              <section class="bg-white rounded-3xl border ${isComplete ? 'border-emerald-300 ring-1 ring-emerald-100' : 'border-slate-200'} p-5 shadow-sm">

                      <div class="text-xs text-slate-500">已批核 ${doneCount} / ${b.items.length} 項</div>

                        status === 'approved' ? 'bg-bgca-greenLight/50 border-emerald-200' :

                            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-white border border-slate-200 text-slate-600">${escapeHtml(it.cat)}</span>

                            </span>

                            </span>

                          `}

                      </div>

                </div>

    function openSubmitProgressModal(memberId, itemId, itemTitle) {
      openModal(`

            </div>

            </div>
          </form>
        </div>
      `);
    }

    function submitMemberProgress(e, memberId, itemId) {
      e.preventDefault();
      const m = state.members.find(x => x.id === memberId);
      if (!m) return;
      if (!m.progress) m.progress = {};
      m.progress[itemId] = {
        status: 'pending',
        date: document.getElementById('sub-date').value,
        note: document.getElementById('sub-note').value.trim()
      };
      saveState();
      closeModal();
      showToast('已送出完成申請，請等待領袖批核！', 'success');
      renderApp();
    }

        : cloudSyncStatus === 'connecting'

        : '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-500 text-[11px] font-bold"><i class="fa-solid fa-hard-drive"></i> 本機儲存模式（尚未填入 Firebase 設定）</span>';

      return `

            <div class="flex items-center gap-2.5 flex-wrap">

    function renderAdminApprovals() {

    function approveRequest(memberId, itemId) {

      delete m.progress[itemId].feedback;
      saveState();
      showToast(`已批准「${m.name}」的進度申請！`, 'success');
      renderApp();

    function openRejectModal(memberId, itemId, memberName) {

    function escapeCsvCell(val) {
      const s = String(val === null || val === undefined ? '' : val);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }

    function parseCsvLine(line) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"' && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cur += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += ch;
          }
        }
      }
      result.push(cur.trim());
      return result;
    }

      const sampleRows = [
        ['陳大文', '童軍', 'Falcon', '隊員', '2024', `2024-2025;2025-2026;${CURRENT_SEASON}`, '童軍會員章;童軍探索獎章'],
        ['李小明', '童軍', '雄鷹小隊', '副小隊長', '2025', `2025-2026;${CURRENT_SEASON}`, '童軍會員章'],

      ];
      const csv = '\uFEFF' + [headers, ...sampleRows].map(r => r.map(escapeCsvCell).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '1201旅_隊員批量匯入範本.csv';

      a.click();

    function exportMembersCsv() {
      const headers = ['姓名', '支部(童軍/深資)', '小隊或組別', '職級', '入旅年份', '活躍學年(用分號分隔)', '已考獲獎章(選填・用分號分隔)'];
      const rows = state.members.map(m => {
        const completedBadges = getBadgesForSection(m.section)
          .filter(b => b.items.every(it => m.progress?.[it.id]?.status === 'approved'))
          .map(b => b.name)
          .join(';');
        return [
          m.name,
          m.section === 'venture' ? '深資' : '童軍',
          m.patrol || '',
          m.rank || '',
          m.joinYear || '',
          (m.academicYears || []).join(';'),
          completedBadges
        ];
      });
      const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(escapeCsvCell).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `1201旅_隊員名冊_${new Date().toISOString().slice(0, 10)}.csv`;

    }

    function matchBadgesFromText(section, rawBadgeText) {
      if (!rawBadgeText) return [];
      const tokens = rawBadgeText.split(/[;；、,，/|]+/).map(s => s.trim()).filter(Boolean);
      const badges = getBadgesForSection(section);
      const matched = [];
      tokens.forEach(tok => {
        const found = badges.find(b => b.name === tok || b.name.includes(tok) || tok.includes(b.name.replace('童軍', '').replace('獎章', '')));
        if (found && !matched.some(x => x.id === found.id)) {
          matched.push(found);
        }
      });
      return matched;
    }

    function handleMemberCsvUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result || '').replace(/^\uFEFF/, '');
          const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (lines.length < 2) {
            showToast('CSV 檔案沒有資料列，請確認已填寫隊員資料', 'warning');
            return;
          }

          const parsedList = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = parseCsvLine(lines[i]);
            const name = (cols[0] || '').trim();
            if (!name) continue;
            const secRaw = (cols[1] || '童軍').trim();
            const section = /深資|venture/i.test(secRaw) ? 'venture' : 'scout';
            const patrol = (cols[2] || '未分組').trim();
            const rank = (cols[3] || '隊員').trim();
            const joinYear = parseInt(cols[4], 10) || new Date().getFullYear();
            const ayRaw = (cols[5] || CURRENT_SEASON).trim();
            const academicYears = ayRaw.split(/[;；、,，]+/).map(s => s.trim()).filter(Boolean);
            if (academicYears.length === 0) academicYears.push(CURRENT_SEASON);
            const matchedBadges = matchBadgesFromText(section, cols[6] || '');
            const existing = state.members.find(m => m.name.trim() === name && m.section === section);

            parsedList.push({
              name,
              section,
              patrol,
              rank,
              joinYear,
              academicYears,
              matchedBadges,
              isUpdate: Boolean(existing)
            });
          }

          if (parsedList.length === 0) {
            showToast('未能從檔案辨識到有效隊員姓名', 'warning');
            return;
          }

          state.pendingBulkMembers = parsedList;
          const area = document.getElementById('bulk-preview-area');
          const summaryEl = document.getElementById('bulk-preview-summary');
          const listEl = document.getElementById('bulk-preview-list');

          const updCnt = parsedList.filter(x => x.isUpdate).length;

          area.classList.remove('hidden');
          summaryEl.textContent = `已成功讀取 ${parsedList.length} 位隊員（新增 ${newCnt} 位・更新現有 ${updCnt} 位）：`;
          listEl.innerHTML = parsedList.map(item => `

                  <span class="text-slate-500">${SECTIONS[item.section].name}・${escapeHtml(item.patrol)}・${escapeHtml(item.rank)}・${item.joinYear}年入旅</span>
                </div>
                ${item.matchedBadges.length > 0 ? `
                  <div class="text-[11px] text-bgca-blue font-bold mt-0.5">
                    <i class="fa-solid fa-award mr-1"></i>將自動批核：${item.matchedBadges.map(b => escapeHtml(b.name)).join('、')}
                  </div>
                ` : ''}
              </div>
              <span class="text-[10px] text-slate-400 shrink-0">${escapeHtml(item.academicYears.join('、'))}</span>
            </div>
          `).join('');
        } catch (err) {
          showToast('讀取 CSV 檔案失敗，請確認格式為 UTF-8 CSV', 'error');
        }
      };
      reader.readAsText(file, 'UTF-8');

    function confirmBulkImportMembers() {
      const list = state.pendingBulkMembers || [];
      if (list.length === 0) return;

      const today = new Date().toISOString().slice(0, 10);
      let added = 0;
      let updated = 0;

      list.forEach(item => {
        let target = state.members.find(m => m.name.trim() === item.name && m.section === item.section);
        if (target) {
          target.patrol = item.patrol;
          target.rank = item.rank;
          target.joinYear = item.joinYear;
          target.academicYears = Array.from(new Set([...(target.academicYears || []), ...item.academicYears]));
          if (!target.progress) target.progress = {};
          updated++;
        } else {
          const prefix = item.section === 'scout' ? 'S1201-' : 'V1201-';
          const existingNums = state.members
            .filter(x => x.id.startsWith(prefix))
            .map(x => parseInt(x.id.replace(prefix, ''), 10) || 0);
          const nextNum = String((existingNums.length ? Math.max(...existingNums) : 0) + 1).padStart(2, '0');
          target = {
            id: prefix + nextNum,
            name: item.name,
            section: item.section,
            patrol: item.patrol,
            rank: item.rank,
            joinYear: item.joinYear,
            academicYears: item.academicYears,
            rankHistory: [{ date: `${item.joinYear}-09`, rank: item.rank, note: '批量匯入初始職級' }],
            progress: {}
          };
          state.members.push(target);
          added++;
        }

        // Auto-approve all items for matched completed badges
        item.matchedBadges.forEach(badge => {
          badge.items.forEach(it => {
            if (target.progress[it.id]?.status !== 'approved') {
              target.progress[it.id] = {
                status: 'approved',
                date: today,
                note: `批量匯入自動批核（${badge.name}）`
              };
            }
          });
        });
      });

      state.pendingBulkMembers = [];
      saveState();
      closeModal();
      showToast(`批量匯入完成！新增 ${added} 位、更新 ${updated} 位隊員`, 'success');
      renderApp();
    }

        return;
      }
      state.editingRankHistory.push({ date: dateVal, rank: rankVal, note: noteVal });
      state.editingRankHistory.sort((a, b) => a.date.localeCompare(b.date));
      const latest = state.editingRankHistory[state.editingRankHistory.length - 1];
      const rankInput = document.getElementById('mf-rank');
      if (rankInput && latest) rankInput.value = latest.rank;

      document.getElementById('mf-rh-rank').value = '';
      document.getElementById('mf-rh-note').value = '';
      renderRankHistoryEditorList();
    }

      state.editingRankHistory.splice(index, 1);

    function saveMemberForm(e, memberId) {
      e.preventDefault();
      const name = document.getElementById('mf-name').value.trim();
      const section = document.getElementById('mf-section').value;
      const patrol = document.getElementById('mf-patrol').value.trim() || '未分組';
      const rank = document.getElementById('mf-rank').value.trim() || '隊員';
      const joinYear = parseInt(document.getElementById('mf-joinyear').value, 10) || 2026;
      const academicYears = Array.from(document.querySelectorAll('input[name="mf-ay"]:checked')).map(cb => cb.value);
      if (academicYears.length === 0) academicYears.push(ACADEMIC_YEARS[0]);

      const historyCopy = (state.editingRankHistory || []).map(r => ({ ...r }));
      const todayMonth = new Date().toISOString().slice(0, 7);

      if (memberId) {
        const m = state.members.find(x => x.id === memberId);
        if (m) {
          const latestRank = historyCopy.length > 0 ? historyCopy[historyCopy.length - 1].rank : m.rank;
          if (rank !== latestRank) {
            historyCopy.push({ date: todayMonth, rank: rank, note: '職級變動' });
          }
          m.name = name;
          m.section = section;
          m.patrol = patrol;
          m.rank = rank;
          m.joinYear = joinYear;
          m.academicYears = academicYears;
          m.rankHistory = historyCopy;
        }
        showToast(`已更新隊員「${name}」資料及職級歷程`, 'success');
      } else {
        if (historyCopy.length === 0) {
          historyCopy.push({ date: `${joinYear}-09`, rank: rank, note: '入旅初始職級' });
        }
        const prefix = section === 'scout' ? 'S1201-' : 'V1201-';
        const nextNum = String(state.members.filter(x => x.section === section).length + 1).padStart(2, '0');
        state.members.push({
          id: prefix + nextNum,
          name,
          section,
          patrol,
          rank,
          joinYear,
          academicYears,
          rankHistory: historyCopy,
          progress: {}
        });
        showToast(`已新增隊員「${name}」至名冊！`, 'success');
      }
      state.editingRankHistory = [];
      saveState();
      closeModal();
      renderApp();
    }

    function confirmMoveMemberToTrash(memberId) {
      const idx = state.members.findIndex(x => x.id === memberId);

      const [removed] = state.members.splice(idx, 1);
      if (!Array.isArray(state.trashMembers)) state.trashMembers = [];
      state.trashMembers.unshift({
        ...removed,
        deletedAt: new Date().toISOString().slice(0, 10)
      });
      saveState();
      closeModal();
      showToast(`已將「${removed.name}」移至臨時垃圾桶（可隨時還原）`, 'info');
      renderApp();

    function restoreMemberFromTrash(memberId) {
      const idx = (state.trashMembers || []).findIndex(x => x.id === memberId);
      if (idx === -1) return;
      const [restored] = state.trashMembers.splice(idx, 1);
      delete restored.deletedAt;
      state.members.push(restored);
      saveState();
      showToast(`已成功還原隊員「${restored.name}」至名冊！`, 'success');
      openTrashModal();

      renderApp();
    }

    function renderAdminMatrix() {
      const sec = state.matrixSectionFilter;
      const members = state.members.filter(m => m.section === sec);
      const items = getAllItemsForSection(sec);

      return `
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div class="inline-flex bg-white p-1 rounded-xl border border-slate-200">
            <button onclick="state.matrixSectionFilter='scout'; renderApp();" class="px-3.5 py-1.5 rounded-lg text-xs font-extrabold ${sec === 'scout' ? 'bg-bgca-green text-white' : 'text-slate-600'}">童軍進度總表</button>
            <button onclick="state.matrixSectionFilter='venture'; renderApp();" class="px-3.5 py-1.5 rounded-lg text-xs font-extrabold ${sec === 'venture' ? 'bg-bgca-blue text-white' : 'text-slate-600'}">深資進度總表</button>
          </div>
          <div class="text-xs text-slate-500 font-semibold">
            按<strong>隊員姓名</strong>可查看詳細考章紀錄；按格子可快速更新：
            <span class="text-bgca-green font-bold ml-1"><i class="fa-solid fa-circle-check"></i> 已完成</span>
            <span class="text-bgca-orange font-bold ml-2"><i class="fa-solid fa-clock"></i> 待批核</span>
            <span class="text-slate-300 font-bold ml-2"><i class="fa-regular fa-circle"></i> 未完成</span>
          </div>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200">
                  <th class="py-3 px-4 font-extrabold text-slate-700 sticky left-0 bg-slate-50 z-10 min-w-[120px]">隊員（點擊睇詳情）</th>
                  ${items.map(it => `
                    <th class="py-3 px-2 font-bold text-slate-600 text-center min-w-[78px]" title="${escapeHtml(it.badgeName + ' - ' + it.title)}">
                      <div class="text-[10px] text-slate-400 truncate max-w-[72px] mx-auto">${escapeHtml(it.badgeName.replace('童軍', '').replace('獎章', ''))}</div>
                      <div class="truncate max-w-[72px] mx-auto">${escapeHtml(it.title.slice(0, 5))}</div>
                    </th>
                  `).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${members.map(m => `
                  <tr class="hover:bg-slate-50/60">
                    <td class="py-3 px-4 sticky left-0 bg-white border-r border-slate-100">
                      <button onclick="openMemberDetailModal('${m.id}')" class="text-left group block w-full">
                        <div class="font-black text-slate-900 group-hover:text-bgca-blue group-hover:underline flex items-center gap-1">
                          ${escapeHtml(m.name)}
                          <i class="fa-solid fa-angle-right text-[10px] text-slate-300 group-hover:text-bgca-blue"></i>
                        </div>
                        <div class="text-[10px] font-normal text-slate-400">${escapeHtml(m.rank)}</div>
                      </button>
                    </td>
                    ${items.map(it => {
                      const st = m.progress?.[it.id]?.status || 'none';
                      return `
                        <td class="py-2 px-1 text-center">
                          <button onclick="toggleMatrixCell('${m.id}', '${it.id}')" class="w-8 h-8 rounded-xl inline-flex items-center justify-center transition ${
                            st === 'approved' ? 'bg-bgca-greenLight text-bgca-green hover:bg-emerald-200' :
                            st === 'pending' ? 'bg-bgca-orangeLight text-bgca-orange hover:bg-orange-200' :
                            'bg-slate-50 text-slate-300 hover:bg-slate-200 hover:text-slate-600'
                          }" title="${escapeHtml(m.name + ' - ' + it.title)}">
                            <i class="fa-solid ${st === 'approved' ? 'fa-check' : st === 'pending' ? 'fa-clock' : 'fa-minus'}"></i>
                          </button>
                        </td>
                      `;
                    }).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openMemberDetailModal(memberId) {
      const m = state.members.find(x => x.id === memberId);
      if (!m) return;
      const sec = SECTIONS[m.section];
      const badges = getBadgesForSection(m.section);
      const stats = getMemberStats(m);
      const rankHistory = Array.isArray(m.rankHistory) ? m.rankHistory : [];

      openModal(`
        <div class="p-6 max-h-[88vh] overflow-y-auto">
          <div class="flex items-start justify-between gap-3 pb-4 mb-4 border-b border-slate-100">
            <div class="flex items-center gap-3.5">
              <div class="w-12 h-12 rounded-2xl ${sec.solidBg} text-white flex items-center justify-center text-lg font-black shadow-sm shrink-0">
                ${escapeHtml(m.name.slice(-1))}
              </div>
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="text-lg font-black text-slate-900">${escapeHtml(m.name)}</h3>
                  <span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold ${sec.colorBg} ${sec.colorText}">${sec.name}</span>
                  <span class="text-xs font-bold text-slate-500">${escapeHtml(m.patrol)}・${escapeHtml(m.rank)}</span>
                </div>
                <div class="text-[11px] text-slate-400 mt-0.5">
                  編號：${m.id}・入旅年份：${m.joinYear} 年・總進度：<strong class="text-bgca-blue">${stats.approved}/${stats.total} 項 (${stats.percent}%)</strong>
                </div>
              </div>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400 shrink-0">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          ${rankHistory.length > 0 ? `
            <div class="mb-4 p-3 rounded-2xl bg-slate-50 border border-slate-200">
              <div class="text-[11px] font-extrabold text-slate-600 mb-2"><i class="fa-solid fa-stairs text-bgca-blue mr-1"></i>成長歷程變化</div>
              <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                ${rankHistory.map((rh, i) => `
                  <span class="px-2.5 py-1 rounded-xl ${i === rankHistory.length - 1 ? 'bg-bgca-blue text-white font-extrabold' : 'bg-white border border-slate-200 text-slate-700 font-bold'}">
                    ${escapeHtml(rh.date)} ${escapeHtml(rh.rank)}
                  </span>
                  ${i < rankHistory.length - 1 ? '<i class="fa-solid fa-arrow-right text-[9px] text-slate-300"></i>' : ''}
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div class="space-y-4">
            ${badges.map(b => {
              const doneItems = b.items.filter(it => m.progress?.[it.id]?.status === 'approved');
              const isComplete = doneItems.length === b.items.length;
              const latestDate = isComplete
                ? doneItems.map(it => m.progress[it.id]?.date || '').sort().pop()
                : '';

              return `
                <div class="rounded-2xl border ${isComplete ? 'border-emerald-300 bg-emerald-50/30' : 'border-slate-200 bg-white'} p-4">
                  <div class="flex items-center justify-between gap-3 mb-3">
                    <div class="flex items-center gap-3">
                      ${renderBadgeEmblem(b.id, 'w-11 h-11')}
                      <div>
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="text-sm font-black text-slate-900">${escapeHtml(b.name)}</span>
                          ${isComplete
                            ? `<span class="px-2 py-0.5 rounded-full bg-bgca-green text-white text-[10px] font-black"><i class="fa-solid fa-trophy mr-1"></i>已考獲${latestDate ? '（' + latestDate + '）' : ''}</span>`
                            : `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px] font-extrabold">已完成 ${doneItems.length} / ${b.items.length} 項</span>`
                          }
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="space-y-1.5">
                    ${b.items.map(it => {
                      const rec = m.progress?.[it.id];
                      const st = rec?.status || 'none';
                      return `
                        <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl border text-xs ${
                          st === 'approved' ? 'bg-bgca-greenLight/60 border-emerald-200' :
                          st === 'pending' ? 'bg-bgca-orangeLight/70 border-orange-200' :
                          'bg-slate-50 border-slate-100'
                        }">
                          <div class="min-w-0 flex-1">
                            <div class="font-bold text-slate-800">${escapeHtml(it.title)}</div>
                            ${rec?.date || rec?.note ? `
                              <div class="text-[11px] text-slate-500 mt-0.5">
                                ${rec.date ? `<span class="font-mono font-semibold text-slate-600 mr-1.5">${escapeHtml(rec.date)}</span>` : ''}
                                ${rec.note ? escapeHtml(rec.note) : ''}
                              </div>
                            ` : ''}
                          </div>
                          <button onclick="toggleItemFromDetailModal('${m.id}', '${it.id}')" class="shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition ${
                            st === 'approved' ? 'bg-bgca-green text-white hover:bg-bgca-greenDark' :
                            st === 'pending' ? 'bg-bgca-orange text-white hover:bg-bgca-orangeDark' :
                            'bg-white border border-slate-200 text-slate-500 hover:border-bgca-green hover:text-bgca-green'
                          }" title="點擊切換完成狀態">
                            ${st === 'approved' ? '<i class="fa-solid fa-check mr-1"></i>已完成' : st === 'pending' ? '<i class="fa-solid fa-clock mr-1"></i>點擊批准' : '未完成'}
                          </button>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="mt-5 flex justify-end gap-2">
            <button onclick="openMemberFormModal('${m.id}')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-extrabold">
              <i class="fa-solid fa-pen-to-square mr-1"></i>編輯基本資料
            </button>
            <button onclick="closeModal()" class="px-5 py-2 rounded-xl bg-bgca-blue text-white text-xs font-extrabold">關閉</button>
          </div>
        </div>
      `, 'max-w-2xl');
    }

    function toggleItemFromDetailModal(memberId, itemId) {
      toggleMatrixCell(memberId, itemId);
      openMemberDetailModal(memberId);
    }

    function toggleMatrixCell(memberId, itemId) {
      const m = state.members.find(x => x.id === memberId);
      if (!m) return;
      if (!m.progress) m.progress = {};
      const cur = m.progress[itemId]?.status || 'none';
      if (cur === 'approved') {
        delete m.progress[itemId];
      } else {
        m.progress[itemId] = {
          status: 'approved',
          date: new Date().toISOString().slice(0, 10),
          note: '由管理員於進度表直接批核'
        };
      }
      saveState();
      renderApp();
    }

    function renderAdminAnnouncements() {
      return `
        <div class="flex justify-end mb-4">
          <button onclick="openAnnouncementModal()" class="px-4 py-2 rounded-xl bg-bgca-blue hover:bg-bgca-blueDark text-white text-xs font-extrabold shadow-sm">
            <i class="fa-solid fa-plus mr-1.5"></i>發佈新通告
          </button>
        </div>
        <div class="space-y-3">
          ${state.announcements.map(ann => `
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex items-start justify-between gap-4">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-slate-100 text-slate-700">${escapeHtml(ann.tag)}</span>
                  <span class="text-xs text-slate-400">${escapeHtml(ann.date)}・${escapeHtml(ann.author)}</span>
                </div>
                <div class="text-sm font-black text-slate-900">${escapeHtml(ann.title)}</div>
                <p class="text-xs text-slate-600 mt-1 line-clamp-2">${escapeHtml(ann.content)}</p>
              </div>
              <button onclick="deleteAnnouncement('${ann.id}')" class="p-2 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 shrink-0">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function openAnnouncementModal() {
      openModal(`
        <div class="p-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-black text-slate-900">發佈最新旅團通告</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-400"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <form onsubmit="saveAnnouncement(event)" class="space-y-3.5">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">分類標籤</label>
                <select id="ann-tag" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm">
                  <option value="旅團通告">旅團通告</option>
                  <option value="總會資訊">總會資訊</option>
                  <option value="物資清單">物資清單</option>
                  <option value="考章貼士">考章貼士</option>
                </select>
              </div>
              <div class="flex items-end pb-2">
                <label class="inline-flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
                  <input id="ann-pin" type="checkbox" class="accent-bgca-orange" /> 置頂顯示
                </label>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">標題 *</label>
              <input id="ann-title" required type="text" placeholder="請輸入通告標題..." class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">內容 *</label>
              <textarea id="ann-content" required rows="4" placeholder="請輸入詳細內容..." class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100">取消</button>
              <button type="submit" class="px-5 py-2 rounded-xl text-xs font-extrabold bg-bgca-blue text-white">立即發佈</button>
            </div>
          </form>
        </div>
      `);
    }

    function saveAnnouncement(e) {
      e.preventDefault();
      state.announcements.unshift({
        id: 'ann_' + Date.now(),
        tag: document.getElementById('ann-tag').value,
        section: 'both',
        title: document.getElementById('ann-title').value.trim(),
        date: new Date().toISOString().slice(0, 10),
        author: '管理員',
        pinned: document.getElementById('ann-pin').checked,
        content: document.getElementById('ann-content').value.trim()
      });
      saveState();
      closeModal();
      showToast('已發佈新通告！', 'success');
      renderApp();
    }

    function deleteAnnouncement(id) {
      state.announcements = state.announcements.filter(x => x.id !== id);
      saveState();
      showToast('已刪除通告', 'info');
      renderApp();
    }

    function exportBackupJSON() {
      const dataStr = JSON.stringify({
        exportedAt: new Date().toISOString(),
        calendarEvents: state.calendarEvents,
        announcements: state.announcements,
        members: state.members
      }, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `1201旅_資料備份_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已下載 JSON 資料備份檔！', 'success');
    }

    function importBackupJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (Array.isArray(parsed.members)) state.members = parsed.members;
          if (Array.isArray(parsed.announcements)) state.announcements = parsed.announcements;
          if (Array.isArray(parsed.calendarEvents)) state.calendarEvents = parsed.calendarEvents;
          saveState();
          showToast('已成功還原備份資料！', 'success');
          renderApp();
        } catch (err) {
          showToast('備份檔案格式不正確，未能匯入', 'error');
        }
      };
      reader.readAsText(file);
    }

    // =========================================================================
    // 12. MAIN RENDER ENTRYPOINT
    // =========================================================================
    function renderApp() {
      updateHeaderUI();
      const root = document.getElementById('app-root');
      if (!root) return;

      if (state.activeTab === 'home') root.innerHTML = renderHomeView();
      else if (state.activeTab === 'calendar') root.innerHTML = renderCalendarView();
      else if (state.activeTab === 'badges') root.innerHTML = renderBadgesView();
      else if (state.activeTab === 'member') root.innerHTML = renderMemberView();
      else if (state.activeTab === 'admin') root.innerHTML = renderAdminView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
      syncOfficialHkHolidays();
      initFirebaseSync();
    });
  </script>
</body>
</html>
